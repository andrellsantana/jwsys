<title>JWSys Protótipo</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600;8..60,700&display=swap">
<style>
/* Layout: barra de papel no topo + conteúdo em coluna única no celular, grade em telas largas. A "folha" do formulário é sempre papel branco. */
:root{
  --bg:#f5f8f9; --surface:#ffffff; --surface-2:#eef3f5; --fg:#26333d; --muted:#6a7884; --line:#e2e8ec;
  --accent:#4a86a6; --accent-fg:#ffffff; --accent-soft:#e5f0f5;
  --ok:#3b8a62; --ok-soft:#e5f3eb; --warn:#a2731f; --warn-soft:#fbf1df; --bad:#b25454; --bad-soft:#fbe9e9;
  --sel:#f0f6f9; --shadow:0 1px 2px rgba(38,51,61,.05),0 4px 14px rgba(38,51,61,.05);
  --paper:#ffffff; --paper-ink:#111111; --paper-line:#7d7d7d;
  --f-ui:"Atkinson Hyperlegible",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-paper:"Source Serif 4",Georgia,"Times New Roman",serif;
  --fs:16px; --radius:14px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#151b20; --surface:#1c242b; --surface-2:#232d35; --fg:#e3eaef; --muted:#9eacb8; --line:#2c3842;
  --accent:#8cc1db; --accent-fg:#10202a; --accent-soft:#213845;
  --ok:#7fcca1; --ok-soft:#1c3328; --warn:#e3bd73; --warn-soft:#382d18; --bad:#eb9a9a; --bad-soft:#3a2224;
  --sel:#22313b; --shadow:0 1px 2px rgba(0,0,0,.25); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#151b20; --surface:#1c242b; --surface-2:#232d35; --fg:#e3eaef; --muted:#9eacb8; --line:#2c3842;
  --accent:#8cc1db; --accent-fg:#10202a; --accent-soft:#213845;
  --ok:#7fcca1; --ok-soft:#1c3328; --warn:#e3bd73; --warn-soft:#382d18; --bad:#eb9a9a; --bad-soft:#3a2224;
  --sel:#22313b; --shadow:0 1px 2px rgba(0,0,0,.25); color-scheme:dark}
/* Paletas opcionais (o padrão é Azul sereno) */
:root[data-palette="salvia"]{--bg:#f5f8f5;--surface-2:#edf3ee;--line:#e0e8e2;--accent:#5a8a6e;--accent-soft:#e5f1e9;--sel:#eff6f1}
:root[data-palette="lavanda"]{--bg:#f7f6fa;--surface-2:#f0eef6;--line:#e5e2ee;--accent:#7a6fa8;--accent-soft:#eeebf7;--sel:#f4f2fa}
:root[data-palette="areia"]{--bg:#f9f7f4;--surface-2:#f3efe9;--line:#ebe4da;--accent:#a8775a;--accent-soft:#f6ece4;--sel:#faf4ef}
:root[data-palette="grafite"]{--bg:#f6f7f8;--surface-2:#eef0f2;--line:#e2e5e8;--accent:#56636f;--accent-soft:#e9ecef;--sel:#f1f3f5}
@media (prefers-color-scheme: dark){
:root[data-palette="salvia"]:not([data-theme="light"]){--bg:#141a17;--surface-2:#222d27;--line:#2b3830;--accent:#94c9a8;--accent-fg:#102018;--accent-soft:#20372b;--sel:#213129}
:root[data-palette="lavanda"]:not([data-theme="light"]){--bg:#17161d;--surface-2:#28263a;--line:#33304a;--accent:#b6acdf;--accent-fg:#1a1630;--accent-soft:#2e2a47;--sel:#2a2740}
:root[data-palette="areia"]:not([data-theme="light"]){--bg:#1b1815;--surface-2:#2e2822;--line:#3a332c;--accent:#dcae90;--accent-fg:#2a1a10;--accent-soft:#3c2c22;--sel:#33291f}
:root[data-palette="grafite"]:not([data-theme="light"]){--bg:#16191c;--surface-2:#262b30;--line:#30363c;--accent:#b4c0cb;--accent-fg:#14181c;--accent-soft:#2c333a;--sel:#262d33}}
:root[data-palette="salvia"][data-theme="dark"]{--bg:#141a17;--surface-2:#222d27;--line:#2b3830;--accent:#94c9a8;--accent-fg:#102018;--accent-soft:#20372b;--sel:#213129}
:root[data-palette="lavanda"][data-theme="dark"]{--bg:#17161d;--surface-2:#28263a;--line:#33304a;--accent:#b6acdf;--accent-fg:#1a1630;--accent-soft:#2e2a47;--sel:#2a2740}
:root[data-palette="areia"][data-theme="dark"]{--bg:#1b1815;--surface-2:#2e2822;--line:#3a332c;--accent:#dcae90;--accent-fg:#2a1a10;--accent-soft:#3c2c22;--sel:#33291f}
:root[data-palette="grafite"][data-theme="dark"]{--bg:#16191c;--surface-2:#262b30;--line:#30363c;--accent:#b4c0cb;--accent-fg:#14181c;--accent-soft:#2c333a;--sel:#262d33}
.palettes{display:flex;gap:6px;align-items:center}
.palettes button{width:28px;height:28px;border-radius:50%;border:2px solid var(--surface);box-shadow:0 0 0 1px var(--line);cursor:pointer;padding:0}
.palettes button[aria-pressed="true"]{box-shadow:0 0 0 2px var(--fg)}
.palettes span{font-size:.8em;color:var(--muted);margin-right:2px}
:root.contraste:not(#_){--fg:#000;--muted:#1a1a1a;--line:#000;--accent:#003a5c;--bg:#fff;--surface:#fff;--surface-2:#eee}
:root.contraste[data-theme="dark"]:not(#_){--fg:#fff;--muted:#f0f0f0;--line:#fff;--accent:#9fd8ff;--accent-fg:#000;--bg:#000;--surface:#000;--surface-2:#111}
:root.fonte-grande{--fs:20px}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--f-ui);font-size:var(--fs);line-height:1.45;margin:0}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.wrap{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);border-bottom:1px solid var(--line)}
header.top .wrap{display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center;padding-block:10px;max-width:1200px;margin:0 auto}
.brand{font-weight:700;letter-spacing:.02em;margin-right:auto}
.brand small{display:block;font-weight:400;color:var(--muted);font-size:.75em;letter-spacing:0}
.roles{display:flex;gap:4px;flex-wrap:wrap}
.roles a{padding:6px 12px;border-radius:999px;text-decoration:none;color:var(--fg);border:1px solid var(--line);font-size:.875em}
.roles a[aria-current="page"]{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}
main.wrap{max-width:1200px;margin:0 auto;padding-block:20px 64px}
h1{font-size:1.5em;margin:0 0 4px;text-wrap:balance}
h2{font-size:1.15em;margin:0 0 10px;text-wrap:balance}
.sub{color:var(--muted);margin:0 0 16px}
.proto{font-size:.8em;color:var(--muted);border:1px dashed var(--line);border-radius:var(--radius);padding:8px 12px;margin-bottom:16px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:8px 16px;border-radius:var(--radius);border:1px solid var(--line);background:var(--surface);cursor:pointer;text-decoration:none;color:var(--fg)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-fg);font-weight:700}
.btn.ok{background:var(--ok);border-color:var(--ok);color:#fff;font-weight:700}
.btn.bad{border-color:var(--bad);color:var(--bad)}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:18px;box-shadow:var(--shadow)}
.kpi,.gcard,.pcard,.item,.tablewrap,.bigmenu button{box-shadow:var(--shadow)}
.btn{transition:background-color .15s,border-color .15s}
.btn:hover:not([disabled]){border-color:var(--accent)}
table.grid tbody tr{cursor:pointer;outline:none}
table.grid tbody tr:hover{background:var(--sel)}
table.grid tbody tr:focus-visible{box-shadow:inset 3px 0 0 var(--accent);background:var(--sel)}
table.grid tbody tr[aria-selected="true"]{background:var(--accent-soft)}
.notes{display:flex;flex-wrap:wrap;gap:4px}
.editor{border:1px solid var(--accent);background:var(--surface);border-radius:var(--radius);padding:16px;margin-bottom:12px;display:flex;flex-direction:column;gap:12px;box-shadow:var(--shadow)}
.hint{font-size:.8em;color:var(--muted)}
kbd{font-family:inherit;font-size:.85em;border:1px solid var(--line);border-bottom-width:2px;border-radius:5px;padding:0 5px;background:var(--surface-2)}
.kpi-big{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin-bottom:16px}
@media (max-width:640px){.kpi-big{grid-template-columns:minmax(0,1fr)}}
.stack{display:flex;flex-direction:column;gap:12px}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.pill{display:inline-flex;align-items:center;gap:4px;padding:2px 10px;border-radius:999px;font-size:.8em;font-weight:700;white-space:nowrap}
.pill.ok{background:var(--ok-soft);color:var(--ok)} .pill.warn{background:var(--warn-soft);color:var(--warn)} .pill.bad{background:var(--bad-soft);color:var(--bad)} .pill.info{background:var(--accent-soft);color:var(--accent)}
.num{font-variant-numeric:tabular-nums}
/* ---------- Publicador ---------- */
.pub{max-width:560px;margin:0 auto}
.hello{font-size:1.6em;font-weight:700;margin:4px 0 2px}
.bigmenu{display:grid;gap:12px;margin-top:20px}
.bigmenu button{min-height:84px;text-align:left;padding:16px 20px;border-radius:14px;border:1px solid var(--line);background:var(--surface);cursor:pointer;display:flex;flex-direction:column;gap:2px}
.bigmenu button b{font-size:1.2em}
.bigmenu button span{color:var(--muted);font-size:.9em}
.bigmenu button.main{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}
.bigmenu button.main span{color:var(--accent-fg);opacity:.85}
.back{background:none;border:0;color:var(--accent);cursor:pointer;padding:8px 0;min-height:44px;font-weight:700}
/* Folha S-4 (réplica esquemática; no sistema real o fundo é o PDF oficial) */
.sheet{background:var(--paper);color:var(--paper-ink);font-family:var(--f-paper);border:1px solid #b9b9b9;box-shadow:0 1px 3px rgba(0,0,0,.18);aspect-ratio:113/85;width:100%;max-width:100%;padding:4.5% 5.5%;display:flex;flex-direction:column;font-size:clamp(11px,3.1vw,17px);color-scheme:light}
.sheet h3{font-family:var(--f-paper);text-align:center;font-weight:700;letter-spacing:.04em;margin:0 0 4%;font-size:1.05em}
.sheet .ln{display:flex;align-items:flex-end;gap:.5em;margin-bottom:2.4%}
.sheet .ln label{white-space:nowrap}
.sheet .fill{flex:1;border:0;border-bottom:1px solid var(--paper-line);background:transparent;font-family:var(--f-ui);color:#0b3a8f;font-size:1em;padding:0 .25em;min-width:0;cursor:pointer;text-align:left;min-height:1.6em}
.sheet table{border-collapse:collapse;width:100%;font-size:.92em;margin-top:1%}
.sheet td{border:1px solid var(--paper-line);padding:.35em .5em;vertical-align:middle}
.sheet td.v{width:22%;text-align:center}
.sheet td.v button{width:100%;min-height:1.8em;border:0;background:transparent;font-family:var(--f-ui);color:#0b3a8f;font-size:1.1em;font-weight:700;cursor:pointer}
.sheet .chk{width:1.2em;height:1.2em;border:1.5px solid #333;display:inline-flex;align-items:center;justify-content:center;font-family:var(--f-ui);color:#0b3a8f;font-weight:700;vertical-align:middle;cursor:pointer;background:transparent;padding:0}
.sheet .obs{flex:1;margin-top:2%;display:flex;flex-direction:column}
.sheet .obs textarea{flex:1;width:100%;border:1px solid var(--paper-line);background:transparent;font-family:var(--f-ui);color:#0b3a8f;resize:none;font-size:.95em;padding:.25em}
.sheet .code{font-size:.7em;margin-top:1.5%}
.sheet .is-off{color:#9a9a9a}
.extras{margin-top:16px}
.extras h2{font-size:1em;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.field{display:flex;flex-direction:column;gap:4px}
.field input,.field select,.field textarea{min-height:44px;border:1px solid var(--line);border-radius:8px;background:var(--surface);padding:8px 10px}
.toggle{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:56px;border-bottom:1px solid var(--line)}
.toggle:last-child{border-bottom:0}
.toggle input{width:26px;height:26px;accent-color:var(--accent)}
.sheetbar{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surface);border-top:1px solid var(--line);box-shadow:0 -6px 24px rgba(0,0,0,.18);padding-bottom:calc(16px + env(safe-area-inset-bottom,0px));padding-top:16px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.sheetbar .inner{max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:12px}
.stepper{display:grid;grid-template-columns:72px 1fr 72px;gap:12px;align-items:center}
.stepper button{height:72px;border-radius:14px;border:1px solid var(--line);background:var(--surface-2);font-size:2em;font-weight:700;cursor:pointer}
.stepper input{height:72px;text-align:center;font-size:2.2em;font-weight:700;border:2px solid var(--accent);border-radius:14px;background:var(--surface);width:100%;min-width:0}
.confirm{text-align:center;padding:40px 16px}
.confirm .mark{width:96px;height:96px;border-radius:50%;margin:0 auto 16px;display:flex;align-items:center;justify-content:center;font-size:52px;font-weight:700}
.confirm .mark.ok{background:var(--ok-soft);color:var(--ok)} .confirm .mark.wait{background:var(--warn-soft);color:var(--warn)}
.list{display:flex;flex-direction:column;gap:8px}
.item{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:14px 16px;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius)}
.item .why{color:var(--bad);font-size:.85em}
/* ---------- Painéis ---------- */
.headline{display:flex;flex-wrap:wrap;gap:12px;align-items:flex-end;justify-content:space-between;margin-bottom:16px}
.count{font-size:.9em;color:var(--muted)}
.count b{font-size:1.6em;color:var(--fg)}
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin-bottom:16px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:12px 14px;text-align:left;cursor:pointer;display:flex;flex-direction:column;gap:2px}
.kpi[aria-pressed="true"]{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.kpi b{font-size:1.6em;font-variant-numeric:tabular-nums}
.kpi span{color:var(--muted);font-size:.85em}
.kpi.ok b{color:var(--ok)} .kpi.bad b{color:var(--bad)} .kpi.warn b{color:var(--warn)} .kpi.info b{color:var(--accent)}
.cols{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.6fr);gap:16px;align-items:start}
.pend{display:flex;flex-direction:column;gap:10px}
.pcard{border:1px solid var(--line);border-left:4px solid var(--warn);border-radius:var(--radius);padding:12px;background:var(--surface);display:flex;flex-direction:column;gap:8px}
.pcard.self{border-left-color:var(--accent)}
.pcard .meta{color:var(--muted);font-size:.85em}
.diff{display:grid;grid-template-columns:auto 1fr 1fr;gap:2px 12px;font-size:.9em}
.diff .h{color:var(--muted);font-size:.8em}
.filters{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:10px}
.filters select,.filters input{min-height:40px;border:1px solid var(--line);border-radius:8px;background:var(--surface);padding:6px 8px;min-width:0;flex:1 1 140px}
.tablewrap{overflow-x:auto;border:1px solid var(--line);border-radius:var(--radius);background:var(--surface)}
table.grid{border-collapse:collapse;width:100%;font-size:.9em}
table.grid th,table.grid td{padding:10px 12px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap}
table.grid th{font-size:.78em;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);background:var(--surface-2)}
table.grid td.n{text-align:right;font-variant-numeric:tabular-nums}
.closed{background:var(--warn-soft);color:var(--warn);border-radius:var(--radius);padding:10px 12px;margin-bottom:12px;font-weight:700}
.timeline{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:0;margin-bottom:18px;position:relative}
.tl{padding:10px 8px 0;border-top:4px solid var(--line);font-size:.85em}
.tl b{display:block;font-size:1.05em}
.tl span{color:var(--muted)}
.tl.done{border-top-color:var(--ok)} .tl.now{border-top-color:var(--accent)}
.tl.now b::after{content:" · hoje";color:var(--accent);font-weight:400}
.groups{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin-bottom:16px}
.gcard{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:12px;display:flex;flex-direction:column;gap:6px}
.bar{height:8px;background:var(--surface-2);border-radius:99px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent)}
.tabs{display:flex;gap:4px;flex-wrap:wrap;border-bottom:1px solid var(--line);margin-bottom:12px}
.tabs button{border:0;background:none;padding:10px 12px;cursor:pointer;border-bottom:3px solid transparent;color:var(--muted)}
.tabs button[aria-selected="true"]{color:var(--fg);border-bottom-color:var(--accent);font-weight:700}
.tabs button .pill{margin-left:4px}
.layout{display:grid;grid-template-columns:220px minmax(0,1fr);gap:20px}
nav.side{display:flex;flex-direction:column;gap:2px;font-size:.92em}
nav.side .grp{font-size:.72em;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin:12px 8px 4px}
nav.side button{text-align:left;border:0;background:none;padding:8px 10px;border-radius:8px;cursor:pointer;min-height:40px}
nav.side button[aria-current="true"]{background:var(--accent-soft);color:var(--accent);font-weight:700}
.prog{display:flex;gap:4px}
.prog i{width:28px;height:8px;border-radius:4px;background:var(--surface-2)}
.prog i.on{background:var(--ok)}
.faixa{font-weight:700}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:999px;z-index:30;font-size:.9em;max-width:calc(100% - 32px)}
@media (max-width:860px){
  .cols,.layout{grid-template-columns:minmax(0,1fr)}
  .kpis,.groups{grid-template-columns:repeat(2,minmax(0,1fr))}
  nav.side{flex-direction:row;overflow-x:auto;gap:4px;padding-bottom:4px}
  nav.side .grp{display:none}
  nav.side button{white-space:nowrap;border:1px solid var(--line)}
  .timeline{grid-template-columns:repeat(5,minmax(0,1fr));font-size:.85em}
}
@media (max-width:640px){
  table.grid.cards thead{display:none}
  table.grid.cards,table.grid.cards tbody,table.grid.cards tr,table.grid.cards td{display:block;width:100%}
  table.grid.cards tr{border-bottom:1px solid var(--line);padding:8px 4px}
  table.grid.cards td{border:0;padding:3px 10px;white-space:normal;display:flex;justify-content:space-between;gap:12px;text-align:right}
  table.grid.cards td::before{content:attr(data-l);color:var(--muted);font-size:.85em;text-align:left}
  table.grid.cards td.n{text-align:right}
  .tablewrap{overflow-x:visible}
  .tl b{font-size:.95em} .tl span{display:none}
}
@media (prefers-reduced-motion:no-preference){.sheetbar{animation:up .18s ease-out}@keyframes up{from{transform:translateY(30px);opacity:.6}}}
</style>

<header class="top"><div class="wrap">
  <div class="brand">JWSys <small>Protótipo navegável · dados fictícios</small></div>
  <div class="palettes" role="group" aria-label="Paleta de cores"><span id="palname">Paleta</span>
      <button data-pal="" style="background:#4a86a6" aria-label="Azul sereno" title="Azul sereno"></button>
      <button data-pal="salvia" style="background:#5a8a6e" aria-label="Verde sálvia" title="Verde sálvia"></button>
      <button data-pal="lavanda" style="background:#7a6fa8" aria-label="Lavanda" title="Lavanda"></button>
      <button data-pal="areia" style="background:#a8775a" aria-label="Areia" title="Areia"></button>
      <button data-pal="grafite" style="background:#56636f" aria-label="Grafite" title="Grafite"></button>
    </div><nav class="roles" aria-label="Perfil">
    <a href="#publicador">Publicador</a><a href="#sg">Superintendente</a><a href="#secretario">Secretário</a><a href="#cs">Comissão de Serviço</a>
  </nav>
</div></header>
<main class="wrap" id="app"></main>

<script>
(function(){
const $=s=>document.querySelector(s);
const app=$('#app');
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function toast(t){const d=document.createElement('div');d.className='toast';d.setAttribute('role','status');d.textContent=t;document.body.appendChild(d);setTimeout(()=>d.remove(),2600)}

let bar=null;

  closeBar();

  bar.innerHTML=`<div class="inner"><div class="row" style="justify-content:space-between"><b>${label}</b><span class="sub" style="margin:0">Use + e − ou digite</span></div>
  <div class="stepper"><button id="mn" aria-label="Diminuir">−</button><input id="sv" inputmode="numeric" pattern="[0-9]*" value="${S[k]}" aria-label="${label}"><button id="pl" aria-label="Aumentar">+</button></div>
  <button class="btn primary" id="okb" style="min-height:56px">Pronto</button></div>`;
  document.body.appendChild(bar);
  const sv=bar.querySelector('#sv');
  const set=v=>{v=Math.max(0,Math.min(999,parseInt(v||0,10)||0));S[k]=v;sv.value=v;const f=$(k==='est'?'#f-est':'#f-h');if(f)f.textContent=v;save()};
  bar.querySelector('#mn').onclick=()=>set(S[k]-1);
  bar.querySelector('#pl').onclick=()=>set(S[k]+1);
  sv.oninput=()=>set(sv.value.replace(/\D/g,''));
  bar.querySelector('#okb').onclick=()=>{closeBar();renderPub()};
  bar.querySelector('#pl').focus();
}
function closeBar(){if(bar){bar.remove();bar=null}}

let selRow=null;
const tipoNota={obs:['Observação','info'],saude:['Saúde','warn'],mudou:['Mudou-se','bad'],removido:['Removido','bad'],papel:['Em nome de (papel)','info']};
function visibleRows(){return rows.map((x,i)=>Object.assign({i},x)).filter(x=>(!q.m||x.m===q.m)&&(!q.e||x.est_===q.e)&&(!q.t||x.tipo===q.t)&&(!q.s||x.p.toLowerCase().includes(q.s.toLowerCase())))}
function fillGrid(){
  const tb=$('#tb');if(!tb)return;
  const r=visibleRows();
  tb.innerHTML=r.map(x=>`<tr tabindex="0" data-i="${x.i}" aria-selected="${selRow===x.i}"><td data-l="Publicador"><b>${esc(x.p)}</b></td><td data-l="Mês">${x.m}</td><td data-l="Participou">${x.part?'Sim':'—'}</td><td data-l="Estudos" class="n">${x.est}</td><td data-l="Horas" class="n">${x.h}</td><td data-l="Crédito" class="n">${x.cr}</td><td data-l="Tipo">${x.tipo}</td><td data-l="Estado"><span class="pill ${x.est_==='Aceito'?'ok':'bad'}">${x.est_}</span></td><td data-l="Recebido" class="num">${x.rec}</td><td data-l="Anotações"><div class="notes">${(x.notas||[]).map(n=>`<span class="pill ${tipoNota[n.t][1]}" title="${esc(n.x)}">${tipoNota[n.t][0]}${n.d?' · '+n.d:''}</span>`).join('')||'<span class="hint">—</span>'}</div></td></tr>`).join('')||'<tr><td colspan="10">Nenhum registro com esses filtros.</td></tr>';
  const trs=[...tb.querySelectorAll('tr[data-i]')];
  trs.forEach((tr,k)=>{
    tr.onclick=()=>openEditor(+tr.dataset.i);
    tr.onkeydown=e=>{
      if(e.key==='ArrowDown'){e.preventDefault();(trs[k+1]||tr).focus()}
      else if(e.key==='ArrowUp'){e.preventDefault();(trs[k-1]||tr).focus()}
      else if(e.key==='Home'){e.preventDefault();trs[0].focus()}
      else if(e.key==='End'){e.preventDefault();trs[trs.length-1].focus()}
      else if(e.key==='Enter'||e.key===' '){e.preventDefault();openEditor(+tr.dataset.i)}
      else if(e.key==='Escape'){closeEditor()}
    };
  });
}
function openEditor(i){
  selRow=i;const x=rows[i];const box=$('#editor');
  if(sgFechado){box.innerHTML=`<div class="editor"><b>${esc(x.p)} · ${x.m}</b><span class="hint">O mês está fechado. Para inserir dados, peça liberação ao secretário.</span><div class="row"><button class="btn" id="ed-no">Fechar</button></div></div>`;$('#ed-no').onclick=closeEditor;fillGrid();return}
  box.innerHTML=`<div class="editor" role="region" aria-label="Inserir dados para ${esc(x.p)}">
    <div class="row" style="justify-content:space-between"><b>${esc(x.p)} · ${x.m}</b><span class="hint">O que for salvo aparece na coluna Anotações</span></div>
    <div class="row"><div class="field" style="flex:2 1 200px"><label for="ed-t">O que registrar</label><select id="ed-t"><option value="obs">Observação no relatório</option><option value="saude">Saúde</option><option value="mudou">Mudou-se</option><option value="removido">Removido</option><option value="papel">Relatório em nome do publicador (papel)</option></select></div>
    <div class="field" style="flex:1 1 140px"><label for="ed-d">Data</label><input id="ed-d" type="date" value="2026-11-04"></div></div>
    <div class="field"><label for="ed-x" id="ed-xl">Descrição</label><input id="ed-x"></div>
    <div class="row"><button class="btn primary" id="ed-ok">Salvar</button><button class="btn" id="ed-no">Cancelar</button></div></div>`;
  const t=$('#ed-t');t.onchange=()=>{$('#ed-xl').textContent=t.value==='papel'?'Justificativa (obrigatória)':'Descrição'};
  $('#ed-no').onclick=closeEditor;
  box.querySelector('.editor').onkeydown=e=>{if(e.key==='Escape')closeEditor()};
  $('#ed-ok').onclick=()=>{
    const v=$('#ed-x').value.trim();
    if(t.value==='papel'&&!v){toast('A justificativa é obrigatória.');$('#ed-x').focus();return}
    const d=$('#ed-d').value;const dd=d?d.split('-').reverse().slice(0,2).join('/'):'';
    (rows[i].notas=rows[i].notas||[]).push({t:t.value,d:t.value==='obs'?'':dd,x:v||tipoNota[t.value][0]});
    if(t.value==='obs'&&v)rows[i].obs=v;
    toast('Salvo: '+tipoNota[t.value][0]+' para '+x.p);closeEditor(i);
  };
  fillGrid();t.focus();
}
function closeEditor(back){
  const i=back??selRow;selRow=null;const b=$('#editor');if(b)b.innerHTML='';fillGrid();
  const tr=document.querySelector(`#tb tr[data-i="${i}"]`);if(tr)tr.focus();
}
function pcard(p){
  return `<article class="pcard ${p.self?'self':''}" data-id="${p.id}">
   <div class="row" style="justify-content:space-between"><b>${esc(p.p)}</b><span class="pill ${p.concil?'info':'warn'}">${p.tipo}</span></div>
   <div class="meta">${p.m} · ${p.info}</div>
   ${p.diff?`<div class="diff"><span class="h"></span><span class="h">Antes</span><span class="h">Depois</span>${p.diff.map(d=>`<span>${d[0]}</span><span class="num">${d[1]}</span><b class="num">${d[2]}</b>`).join('')}</div>`:''}
   ${p.d?`<div class="meta">${Object.entries(p.d).map(([k,v])=>k+': <b>'+v+'</b>').join(' · ')}</div>`:''}
   ${p.self?'<div class="meta" style="color:var(--accent)">É o seu próprio relatório. A decisão fica marcada como autoaprovação.</div>':''}
   ${p.concil?`<div class="field"><label for="c${p.id}">Associar ao publicador</label><select id="c${p.id}">${pubs.map(x=>`<option ${x.n==='Ana Souza'?'selected':''}>${x.n}</option>`).join('')}</select></div>`:''}
   <div class="row"><button class="btn ok" data-a="ok">${p.concil?'Conciliar e aceitar':'Aprovar'}</button><button class="btn bad" data-a="no">Recusar</button></div>
   <div class="motivo stack" hidden><div class="field"><label for="m${p.id}">Motivo da recusa (obrigatório)</label><textarea id="m${p.id}" rows="2"></textarea></div><button class="btn bad" data-a="conf">Confirmar recusa</button></div>
  </article>`;
}
function bindPend(rerender){
  app.querySelectorAll('.pcard').forEach(c=>{
    const id=+c.dataset.id;
    c.querySelector('[data-a="ok"]').onclick=()=>{pend=pend.filter(p=>p.id!==id);toast('Aprovado');rerender()};
    c.querySelector('[data-a="no"]').onclick=()=>{c.querySelector('.motivo').hidden=false;c.querySelector('textarea').focus()};
    c.querySelector('[data-a="conf"]').onclick=()=>{const t=c.querySelector('textarea');if(!t.value.trim()){toast('Escreva o motivo da recusa.');t.focus();return}pend=pend.filter(p=>p.id!==id);toast('Recusado. O publicador verá o motivo.');rerender()};
  });
}
